[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "root-spector"
version = "1.0.0"
description = "Agente LangGraph que investiga a causa raiz de nao-conformidades de bioprocesso, complementar ao BiotecPredict"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "pydantic>=2.9",
    "typing-extensions>=4.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    # PDF do relatório final, gerado sob demanda (root_cause_agent/reports.py
    # ::gerar_pdf) -- puro Python, sem dependência nativa de sistema (ao
    # contrário do WeasyPrint, que exige GTK/Pango instalados à parte),
    # funciona igual em desenvolvimento local, CI e no deploy.
    "xhtml2pdf>=0.2.17",
    # Checkpointer condicional (graph.py::_criar_checkpointer), log
    # estruturado em banco (config.py::_HandlerBancoDeDados) e persistência
    # dos embeddings do RAG (root_cause_agent/rag.py::_vector_store_postgres)
    # usam Postgres só quando DATABASE_URL estiver definida (deploy, Azure
    # Database for PostgreSQL); em dev/CI, sem essa variável, o SQLite
    # local/InMemoryVectorStore continuam sendo o padrão, sem exigir
    # nenhuma conexão real. Precisam estar instalados de qualquer forma,
    # tanto em produção (para o caminho Postgres funcionar de verdade)
    # quanto em dev/CI (para os testes que cobrem esse caminho, com um
    # Postgres fake, rodarem).
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "langchain-postgres>=0.0.12",
    # DeterministicFakeEmbedding (langchain_core.embeddings) depende de
    # numpy em runtime, mesmo sem declará-lo -- ativado por LLM_PROVIDER=fake
    # (root_cause_agent/rag.py). Além dos testes/CI, é o mesmo sinal usado
    # em produção pra desativar chamadas reais de LLM/embedding (ex: modo
    # demonstração), então precisa estar disponível fora de dev também, não
    # só como dependência de teste.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["root_cause_agent*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# scripts/setup_github*.py administram o GitHub (labels/milestones/issues/
# board) e não fazem parte do runtime do agente -- o corpo das issues em
# texto livre passa do limite de linha às vezes, sem risco real. Mantém
# as regras F/I/UP (bugs reais: import não usado, nome indefinido etc.)
# ativas, só relaxa a checagem cosmética de comprimento de linha (E501)
# nesses arquivos. `setup_github_fase02.py` é o mesmo script,
# só pra Fase 2 (specs/fase02/gitflow.md), separado por não subscrever
# a automação da Fase 1.
"scripts/setup_github.py" = ["E501"]
"scripts/setup_github_fase02.py" = ["E501"]
